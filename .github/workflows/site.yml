name: Build and deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # uv sync also installs pagefind[bin], the search indexer that `ncert-diff build` runs.
      - run: uv sync --no-dev
      # Page images are served from object storage, see scripts/upload-images.sh.
      # Set the IMAGES_BASE repository variable to the public bucket URL.
      # A project site lives under /<repository name>. With a custom domain, set the BASE_URL
      # repository variable to "/" so the site is built for the domain root.
      - run: uv run ncert-diff build --images-base "${IMAGES_BASE:-/images}" --base-url "${BASE_URL:-/$REPO_NAME}"
        env:
          IMAGES_BASE: ${{ vars.IMAGES_BASE }}
          BASE_URL: ${{ vars.BASE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to publish the artifact
      id-token: write # to prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

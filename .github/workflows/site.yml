name: Build and deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      # uv sync also installs pagefind[bin], the search indexer that `ncert-diff build` runs.
      - run: uv sync --no-dev
      # Page images are served from object storage, see scripts/upload-images.sh.
      # Set the IMAGES_BASE repository variable to the public bucket URL.
      # A project site lives under /<repository name>. With a custom domain, set the BASE_URL
      # repository variable to "/" so the site is built for the domain root.
      - run: uv run ncert-diff build --images-base "${IMAGES_BASE:-/images}" --base-url "${BASE_URL:-/$REPO_NAME}"
        env:
          IMAGES_BASE: ${{ vars.IMAGES_BASE }}
          BASE_URL: ${{ vars.BASE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

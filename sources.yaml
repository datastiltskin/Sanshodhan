# Every file the project downloads, hand-curated. This is the only place Wayback URLs live.
#
# Each snapshot is fetched exactly once. Wayback entries use the raw-file form
#   http://web.archive.org/web/<wayback>id_/<url>
# so the archive serves the original bytes without its toolbar. Entries without a
# "wayback" key are fetched live from ncert.nic.in.
#
# NCERT file naming: <code><NN>.pdf is chapter NN, <code>ps.pdf is the prelims
# (title pages, foreword, contents), <code>dd.zip is the whole book.
#
# Labels are capture dates (UTC) for Wayback snapshots and "live" for the current site.
# The fetcher turns "live" into live-<today>.

books:
  our-pasts-2:
    class: 7
    subject: history
    language: en
    title: "Our Pasts II"
    code: gess1
    snapshots:
      # ncerts/l era. The 2014 zip contains PDFs created in March/April 2007 (first edition text).
      - { label: "2014-07-28", wayback: "20140728062605", url: "http://ncert.nic.in/ncerts/l/gess1dd.zip" }
      - { label: "2016-09-10", wayback: "20160910135511", url: "http://ncert.nic.in/ncerts/l/gess1dd.zip" }

      - { label: "live", url: "https://ncert.nic.in/textbook/pdf/gess1dd.zip" }
      # No whole-book zip survives for the 2016-17 to 2018-19 printings (the 2019-03-12 zip
      # turned out to hold other books). These are the only per-chapter captures from those
      # years. "partial" snapshots form partial editions and are compared chapter by chapter.

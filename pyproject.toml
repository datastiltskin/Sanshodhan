[project]
name = "ncert-diff"
version = "0.1.0"
description = "Track what changes between editions of NCERT history textbooks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ncert-diff = "ncert_diff.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncert_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

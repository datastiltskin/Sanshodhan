[project]
name = "ncert-diff"
version = "0.1.0"
description = "Sanshodhan: see what changed in NCERT textbooks over the years."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.6",
    "ocrmac>=1.0.1 ; sys_platform == 'darwin'",
    "pillow>=10",
    "pymupdf>=1.24",
    "pyspellchecker>=0.9.1",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ncert-diff = "ncert_diff.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncert_diff"]
include = ["src/ncert_diff/site/templates/*", "src/ncert_diff/site/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
